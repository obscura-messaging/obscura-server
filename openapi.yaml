openapi: 3.0.3
info:
  title: Obscura Server API
  description: |
    A privacy-first messaging relay.
    - **Control Plane (REST):** Registration, Device Management, Key Management, Sending.
    - **Data Plane (WebSocket):** Real-time message delivery and acknowledgement.
    - **Protocol:** Protocol Buffers (application/x-protobuf) are used for message bodies to minimize metadata leakage and binary bloat.

    **Protobuf Definitions:**
    The WebSocket and Message schemas are defined in the [obscura-proto](https://github.com/obscura-messaging/obscura-proto/blob/main/obscura/v1/obscura.proto) repository.
  version: 0.0.0
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html
security:
  - bearerAuth: []
paths:
  # --- Users ---
  /v1/users:
    post:
      operationId: registerUser
      summary: Register a new user account and provision its primary device.
      description: |
        Atomically creates a new user account, sets its account identity key, provisions its
        primary device with the provided prekeys, and returns a session (`token`, `refreshToken`,
        `expiresAt`, `userId`, `deviceId`). The signed prekey must verify against `identityKey`.
      tags: [Users]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '201':
          description: Account and primary device created.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '408':
          $ref: '#/components/responses/RequestTimeoutError'
        '409':
          description: Username already exists.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- Keys ---
  /v1/keys:
    post:
      operationId: uploadKeys
      summary: Upload PreKeys.
      description: |
        Uploads any subset of the authenticated device's pre-keys (see `PreKeyUploadRequest`).
        Every signed pre-key and Kyber pre-key must verify against the account identity key, which cannot be
        changed here.
      tags: [Keys]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreKeyUploadRequest'
      responses:
        '204':
          description: Keys updated.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '408':
          $ref: '#/components/responses/RequestTimeoutError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/keys/{userId}:
    get:
      operationId: getPreKeyBundle
      summary: Fetch PreKey Bundles for all of a user's devices.
      description: |
        Returns the PreKey bundles for every device registered to the target user.
        Every bundle carries the account identity key, which all of the user's devices share;
        the registration id and pre-keys are per device.
        Server atomically consumes one One-Time PreKey and one one-time Kyber PreKey per device (if available);
        a device with no one-time Kyber PreKey left serves its last-resort Kyber PreKey instead.
      tags: [Keys]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: PreKey Bundles, one per device.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreKeyBundleListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '408':
          $ref: '#/components/responses/RequestTimeoutError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/keys/{userId}/devices/{deviceId}:
    get:
      operationId: getDevicePreKeyBundle
      summary: Fetch the PreKey Bundle of one of a user's devices.
      description: |
        Returns the PreKey bundle of one device of the target user, carrying the account identity key.
        Server atomically consumes one One-Time PreKey and one one-time Kyber PreKey on that device only
        (if available, falling back to its last-resort Kyber PreKey), so a client
        that needs a session with a single new device does not consume prekeys on the user's other devices.
      tags: [Keys]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The device's PreKey Bundle.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreKeyBundleResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '408':
          $ref: '#/components/responses/RequestTimeoutError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- Session ---
  /v1/session:
    post:
      operationId: login
      summary: Login an existing device and retrieve a session.
      description: |
        Authenticates with username, password, and `deviceId`. If the credentials are valid and
        `deviceId` belongs to the user, returns an `AuthResponse` (`token`, `refreshToken`,
        `expiresAt`, `userId`, `deviceId`). If the credentials are valid but `deviceId` does not belong to
        the user (e.g. the device was unlinked or the account was reset), returns `409 Conflict`.
      tags: [Sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '408':
          $ref: '#/components/responses/RequestTimeoutError'
        '409':
          description: The provided `deviceId` does not belong to the authenticated user.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      operationId: logout
      summary: Logout (Revoke Device Refresh Token).
      description: |
        Revokes the authenticated device's refresh token, effectively ending its session.
      tags: [Sessions]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Session revoked.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '408':
          $ref: '#/components/responses/RequestTimeoutError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/session/refresh:
    post:
      operationId: refreshToken
      summary: Refresh Access Token.
      description: |
        Exchanges a valid Refresh Token for a new pair (Access Token + Refresh Token).
        Implements Rotation: The old Refresh Token is invalidated immediately.
      tags: [Sessions]
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens refreshed.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '408':
          $ref: '#/components/responses/RequestTimeoutError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/users/reset:
    post:
      operationId: resetAccount
      summary: Reset the account's devices and identity, and provision a new primary device.
      description: |
        Deletes all of the account's devices, with their keys, queued messages, push tokens
        and refresh tokens, and the account's link sessions; replaces the account identity key;
        provisions a new primary device with the provided prekeys; and returns a fresh session.
        Live gateway connections of the deleted devices are closed and their tokens stop working.

        Authorized by the account's username and password, not by a token.
        Rate limited like registration and login.
      tags: [Users]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetAccountRequest'
      responses:
        '200':
          description: Account reset and new primary device provisioned.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          description: The username or password is wrong.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          $ref: '#/components/responses/RequestTimeoutError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- Devices ---
  /v1/devices:
    post:
      operationId: createDevice
      summary: Provision a linked device.
      description: |
        Creates a new linked device for the account bound to `linkSessionId`, uploads its
        cryptographic keys, consumes the approved link session in the same transaction, and
        returns a session (`AuthResponse`).

        Authorized by `linkSessionId` (an unexpired link session that the account's primary
        device approved via `PUT /v1/link-sessions/{id}`). Does not require a bearer token.
        `identityKey` must equal the account identity, and the signed prekey must verify against it.
        The server enforces a configurable maximum number of devices per user.
      tags: [Devices]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
      responses:
        '201':
          description: Linked device provisioned.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          description: |
            The device cannot be registered. The `error` is one of:
            - `Device limit reached. Maximum allowed is <n>.`
            - `Invalid link session`: `linkSessionId` is unknown, expired, not approved, or already used.
            - `Identity key does not match the account identity`: `identityKey` is not the account identity.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          $ref: '#/components/responses/RequestTimeoutError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      operationId: listDevices
      summary: List all devices for the authenticated user.
      description: |
        Lists every device of the account, marking the primary device with `isPrimary`.
      tags: [Devices]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of devices.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '408':
          $ref: '#/components/responses/RequestTimeoutError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/devices/{deviceId}:
    delete:
      operationId: deleteDevice
      summary: Delete a device.
      description: |
        Deletes a device of the authenticated user's account.
        - The primary device may delete any other device of the account.
        - Any other device may delete itself.
        - The primary device cannot be deleted this way; use `POST /v1/users/reset`.

        Cascade delete removes the device's keys, the messages queued for it, its push token
        and refresh tokens. Messages the device sent that are still
        queued for other devices are kept. The device's access tokens stop working immediately
        and its live gateway connections are closed.
      tags: [Devices]
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Device deleted.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: |
            The caller may not delete this device. The `error` is one of:
            - `The primary device cannot be deleted; reset the account instead`
            - `Only the primary device can delete other devices`
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '408':
          $ref: '#/components/responses/RequestTimeoutError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- Link sessions ---
  /v1/link-sessions:
    post:
      operationId: createLinkSession
      summary: Verify credentials and create a link session.
      description: |
        Starts linking a new device to the account. Authenticates with `username` and `password`,
        replaces any prior unapproved link session for the user, and returns `{ id, userId, expiresAt }`.
        The new device shows the secret `id` to the primary device (e.g. in a QR code) and polls
        `GET /v1/link-sessions/{id}` until the primary approves it with `PUT /v1/link-sessions/{id}`.
        An approved session authorizes one `POST /v1/devices` (`linkSessionId`), which consumes it.

        The session is bound to the account and expires after 10 minutes.
        The id is a 256-bit secret; the server stores only its SHA-256 hash.
        Rate limited like registration and login.
      tags: [Link Sessions]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkSessionRequest'
      responses:
        '201':
          description: Session created.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '408':
          $ref: '#/components/responses/RequestTimeoutError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/link-sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Secret id returned by `POST /v1/link-sessions`.
    put:
      operationId: approveLinkSession
      summary: Approve a link session.
      description: |
        Stores one opaque body (the encrypted provisioning message for the new device), which approves
        the session. The server never parses it. Requires a JWT of the primary device of
        the account the session is bound to. A session is approved once.
      tags: [Link Sessions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 65536
      responses:
        '204':
          description: Session approved.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: '`Primary device required`: the caller is not the primary device.'
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The session is unknown, expired, or bound to another account.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          $ref: '#/components/responses/RequestTimeoutError'
        '409':
          description: '`Link session already approved`.'
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      operationId: getLinkSession
      summary: Poll a link session's approval.
      description: |
        Returns the body stored by the primary once the session is approved, or 204 if it is not
        approved yet. Reading does not consume the session.
        Authorized by the unguessable 256-bit secret `id` in the path; does not require a bearer token.
      tags: [Link Sessions]
      security: []
      responses:
        '200':
          description: The session is approved; the body stored by the primary.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '204':
          description: The session is not approved yet.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
        '404':
          description: The session is unknown, expired, or consumed.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          $ref: '#/components/responses/RequestTimeoutError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- Messaging (REST Upstream) ---
  /v1/messages:
    post:
      operationId: sendMessages
      summary: Send one or more encrypted messages.
      description: |
        Pushes encrypted envelopes to target devices' queues, grouped by recipient user.

        **Complete delivery:** For each recipient user in `recipients`, any targeted `device_id` that does not belong to that user is reported in `invalid_device_ids` and not queued. The remaining targeted devices must cover all of that user's current devices (excluding the sending device when the user is the sender); otherwise none of that user's submissions are queued and `device_mismatches` lists the user's untargeted devices.

        **Idempotency:** Requires an `Idempotency-Key` header to safely retry dropped network requests. The response is cached per `(sender_device_id, Idempotency-Key)`, a mismatch included, so a retry with a corrected device set needs a new key.
        **Payload:** `SendMessageRequest` (Protobuf).
        **Response:** `SendMessageResponse` (Protobuf) detailing any `invalid_device_ids` and `device_mismatches`. Both lists empty indicates total success.
      tags: [Messaging]
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated UUID. Used to prevent duplicate processing on network retries.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
              description: Serialized `SendMessageRequest` protobuf.
      responses:
        '200':
          description: Batch processed. Parse the response payload to check for `invalid_device_ids` and `device_mismatches`.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/x-protobuf:
              schema:
                type: string
                format: binary
                description: Serialized `SendMessageResponse` protobuf.
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '408':
          $ref: '#/components/responses/RequestTimeoutError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'


  # --- WebSocket Gateway (Documentation Only) ---
  /v1/gateway/ticket:
    post:
      operationId: generateTicket
      summary: Generate a WebSocket connection ticket.
      description: |
        Generates a short-lived, single-use ticket for establishing a WebSocket connection.
        This allows the client to authenticate via the `Authorization` header once, and then
        pass the ticket as a query parameter in the WebSocket handshake (where custom headers are often difficult to set).
      tags: [Messaging]
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Ticket generated.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '408':
          $ref: '#/components/responses/RequestTimeoutError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/gateway:
    get:
      operationId: connectGateway
      summary: Connect to the Message Stream.
      description: |
        **WebSocket Endpoint.**
        Clients must connect here to receive messages for a specific device.
        - **Protocol:** `WebSocketFrame` (Protobuf).
        - **Auth:** Pass a valid ticket in the query string: `ws://.../v1/gateway?ticket=<ticket>`.
        - **Handshake:** Server takes the ticket, ensuring it exists and hasn't expired or been used, and that its device still exists. A ticket is consumed by its first handshake attempt.
        - **Welcome:** Upon successful connection, the server may immediately push a `PreKeyStatus` frame if the device's one-time pre-key count is below the configured threshold.
        - **Flow:** Server pushes `EnvelopeBatch` frames. Client MUST respond with `AckMessage` frames. Server batches deletions based on ACKs.
      tags: [Messaging]
      security:
        - ticketAuth: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema:
            type: string
          description: Single-use WebSocket authentication ticket.
      responses:
        '101':
          description: Switching Protocols.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- Attachments (Binary Storage) ---
  /v1/attachments:
    post:
      operationId: uploadAttachment
      summary: Upload an attachment.
      description: |
        Uploads an encrypted binary blob to long-term storage.
        Blobs are automatically deleted after a configured period.
        Maximum and minimum size limits are enforced by the server.
      tags: [Attachments]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              minLength: 1
      responses:
        '201':
          description: Upload successful.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '408':
          $ref: '#/components/responses/RequestTimeoutError'
        '411':
          $ref: '#/components/responses/LengthRequiredError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/attachments/{id}:
    get:
      operationId: downloadAttachment
      summary: Download an attachment.
      description: |
        Downloads an encrypted binary blob from storage.
      tags: [Attachments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: The unique identifier for this attachment (from ETag).
      responses:
        '200':
          description: Binary file stream.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
            ETag:
              description: The unique identifier for this attachment version.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: Attachment not modified (client already has the latest version).
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '408':
          $ref: '#/components/responses/RequestTimeoutError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # --- Push Notifications ---
  /v1/push-token:
    put:
      operationId: updatePushToken
      summary: Register or update a push notification token.
      description: |
        Associates an FCM or APNS token with the authenticated device for wake-up signals.
        Each device has its own push token. Updating the token replaces any existing one for this device.
      tags: [Push Notifications]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPushTokenRequest'
      responses:
        '204':
          description: Token registered successfully.
          headers:
            x-request-id:
              $ref: '#/components/headers/x-request-id'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '408':
          $ref: '#/components/responses/RequestTimeoutError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ticketAuth:
      type: apiKey
      in: query
      name: ticket

  headers:
    x-request-id:
      description: Unique identifier for the request, used for tracing and debugging.
      schema:
        type: string
        format: uuid
    retry-after:
      description: Whole seconds to wait before retrying. At least 1, and always long enough for the retry to pass the rate limiter.
      schema:
        type: integer
        minimum: 1

  responses:
    UnauthorizedError:
      description: Unauthorized (Invalid or missing token, or a token of a deleted device).
      headers:
        x-request-id:
          $ref: '#/components/headers/x-request-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequestError:
      description: Invalid input, malformed request, or missing required headers.
      headers:
        x-request-id:
          $ref: '#/components/headers/x-request-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Forbidden (Action not allowed, e.g., non-primary device approving a link session).
      headers:
        x-request-id:
          $ref: '#/components/headers/x-request-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: The requested resource was not found.
      headers:
        x-request-id:
          $ref: '#/components/headers/x-request-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Conflict (e.g., username taken, link session already approved, or device does not belong to user).
      headers:
        x-request-id:
          $ref: '#/components/headers/x-request-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RequestTimeoutError:
      description: Request Timeout (The server timed out waiting for the request).
      headers:
        x-request-id:
          $ref: '#/components/headers/x-request-id'
    LengthRequiredError:
      description: Length Required (Content-Length header missing).
      headers:
        x-request-id:
          $ref: '#/components/headers/x-request-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLargeError:
      description: Payload Too Large (Upload exceeds maximum size limit).
      headers:
        x-request-id:
          $ref: '#/components/headers/x-request-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequestsError:
      description: Rate limit exceeded.
      headers:
        x-request-id:
          $ref: '#/components/headers/x-request-id'
        retry-after:
          $ref: '#/components/headers/retry-after'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal Server Error.
      headers:
        x-request-id:
          $ref: '#/components/headers/x-request-id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Semantic error message.

    AuthResponse:
      type: object
      required:
        - token
        - refreshToken
        - expiresAt
        - userId
        - deviceId
      properties:
        token:
          type: string
          description: Short-lived JWT Access Token.
        refreshToken:
          type: string
          description: Long-lived opaque Refresh Token.
        expiresAt:
          type: integer
          format: int64
          description: UNIX timestamp of access token expiration.
        userId:
          type: string
          format: uuid
          description: The authenticated user's UUID.
        deviceId:
          type: string
          format: uuid
          description: The authenticated device's UUID.

    LoginRequest:
      type: object
      required:
        - username
        - password
        - deviceId
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 50
        password:
          type: string
          minLength: 12
        deviceId:
          type: string
          format: uuid
          description: Required. The existing device UUID to authenticate.

    CreateLinkSessionRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 50
        password:
          type: string

    ResetAccountRequest:
      type: object
      required:
        - username
        - password
        - identityKey
        - registrationId
        - signedPreKey
        - lastResortKyberPreKey
        - oneTimePreKeys
        - kyberPreKeys
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 50
        password:
          type: string
        name:
          type: string
          maxLength: 100
          description: Optional human-readable label for the new primary device.
        identityKey:
          type: string
          format: byte
          description: Base64 encoded public identity key for the new account identity.
        registrationId:
          type: integer
          format: int32
        signedPreKey:
          $ref: '#/components/schemas/SignedPreKey'
        lastResortKyberPreKey:
          $ref: '#/components/schemas/KyberPreKey'
        oneTimePreKeys:
          type: array
          items:
            $ref: '#/components/schemas/OneTimePreKey'
        kyberPreKeys:
          type: array
          description: One-time Kyber pre-keys. IDs must be unique and differ from the last-resort key's ID.
          items:
            $ref: '#/components/schemas/KyberPreKey'

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    RegisterPushTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: FCM or APNS device token.

    RegistrationRequest:
      type: object
      required:
        - username
        - password
        - identityKey
        - registrationId
        - signedPreKey
        - lastResortKyberPreKey
        - oneTimePreKeys
        - kyberPreKeys
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 50
        password:
          type: string
          minLength: 12
        name:
          type: string
          maxLength: 100
          description: Optional human-readable label for the primary device.
        identityKey:
          type: string
          format: byte
          description: Base64 encoded public identity key.
        registrationId:
          type: integer
          format: int32
        signedPreKey:
          $ref: '#/components/schemas/SignedPreKey'
        lastResortKyberPreKey:
          $ref: '#/components/schemas/KyberPreKey'
        oneTimePreKeys:
          type: array
          items:
            $ref: '#/components/schemas/OneTimePreKey'
        kyberPreKeys:
          type: array
          description: One-time Kyber pre-keys. IDs must be unique and differ from the last-resort key's ID.
          items:
            $ref: '#/components/schemas/KyberPreKey'

    CreateDeviceRequest:
      type: object
      required:
        - linkSessionId
        - identityKey
        - registrationId
        - signedPreKey
        - lastResortKyberPreKey
        - oneTimePreKeys
        - kyberPreKeys
      properties:
        linkSessionId:
          type: string
          description: An approved session from `POST /v1/link-sessions`.
        name:
          type: string
          maxLength: 100
          description: Optional human-readable label for the device (e.g. "My Phone").
        identityKey:
          type: string
          format: byte
          description: Base64 encoded public identity key (must match the account identity).
        registrationId:
          type: integer
          format: int32
        signedPreKey:
          $ref: '#/components/schemas/SignedPreKey'
        lastResortKyberPreKey:
          $ref: '#/components/schemas/KyberPreKey'
        oneTimePreKeys:
          type: array
          items:
            $ref: '#/components/schemas/OneTimePreKey'
        kyberPreKeys:
          type: array
          description: One-time Kyber pre-keys. IDs must be unique and differ from the last-resort key's ID.
          items:
            $ref: '#/components/schemas/KyberPreKey'

    DeviceResponse:
      type: object
      required:
        - deviceId
        - isPrimary
      properties:
        deviceId:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        isPrimary:
          type: boolean
          description: Whether this is the account's primary device, the only one that links or unlinks devices.

    DeviceListResponse:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceResponse'

    PreKeyUploadRequest:
      type: object
      description: |
        Any subset of the device's pre-keys, as in Signal's `SetKeysRequest`: the client rotates the signed and
        last-resort Kyber pre-keys on a schedule and refills a one-time pool when it runs low. Absent parts are
        left as they are; an empty body is a no-op.
      properties:
        signedPreKey:
          description: Replaces the signed pre-key. ID must be strictly greater than the current stored ID.
          allOf:
            - $ref: '#/components/schemas/SignedPreKey'
        lastResortKyberPreKey:
          description: Replaces the device's last-resort Kyber pre-key, served when its one-time Kyber pool is empty.
          allOf:
            - $ref: '#/components/schemas/KyberPreKey'
        oneTimePreKeys:
          type: array
          description: If not empty, replaces all of the device's one-time EC pre-keys.
          items:
            $ref: '#/components/schemas/OneTimePreKey'
        kyberPreKeys:
          type: array
          description: |
            If not empty, replaces all of the device's one-time Kyber pre-keys. IDs must be unique and differ from
            the ID of a last-resort key in the same upload.
          items:
            $ref: '#/components/schemas/KyberPreKey'

    PreKeyBundleListResponse:
      type: object
      required: [bundles]
      properties:
        bundles:
          type: array
          items:
            $ref: '#/components/schemas/PreKeyBundleResponse'

    PreKeyBundleResponse:
      type: object
      properties:
        deviceId:
          type: string
          format: uuid
          description: The device this bundle belongs to.
        registrationId:
          type: integer
          format: int32
        identityKey:
          type: string
          format: byte
          description: The account identity key, the same for every device of the user.
        signedPreKey:
          $ref: '#/components/schemas/SignedPreKey'
        kyberPreKey:
          description: A one-time Kyber pre-key when the device has one left, otherwise its last-resort key.
          allOf:
            - $ref: '#/components/schemas/KyberPreKey'
        oneTimePreKey:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/OneTimePreKey'

    SignedPreKey:
      type: object
      required:
        - keyId
        - publicKey
        - signature
      properties:
        keyId:
          type: integer
          format: int32
        publicKey:
          type: string
          format: byte
          description: Base64 encoded public key
        signature:
          type: string
          format: byte
          description: Base64 encoded signature

    OneTimePreKey:
      type: object
      required:
        - keyId
        - publicKey
      properties:
        keyId:
          type: integer
          format: int32
        publicKey:
          type: string
          format: byte
          description: Base64 encoded public key

    KyberPreKey:
      type: object
      description: A PQXDH Kyber pre-key, signed by the account identity key.
      required:
        - keyId
        - publicKey
        - signature
      properties:
        keyId:
          type: integer
          format: int32
        publicKey:
          type: string
          format: byte
          description: Base64 encoded Kyber1024 public key in libsignal's format (0x08 type byte, then 1568 bytes).
        signature:
          type: string
          format: byte
          description: Base64 encoded XEdDSA signature by the account identity key over the prefixed public key.

    AttachmentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        expiresAt:
          type: integer
          format: int64
          description: UNIX timestamp of when the file will be deleted.

    LinkSessionResponse:
      type: object
      required: [id, userId, expiresAt]
      properties:
        id:
          type: string
          description: Secret session id, used in `/v1/link-sessions/{id}` and as `linkSessionId`.
        userId:
          type: string
          format: uuid
          description: The account user ID bound to this link session.
        expiresAt:
          type: integer
          format: int64
          description: UNIX timestamp after which the session and its body are no longer accepted.

    TicketResponse:
      type: object
      required: [ticket]
      properties:
        ticket:
          type: string
          description: A short-lived, single-use authentication ticket.
